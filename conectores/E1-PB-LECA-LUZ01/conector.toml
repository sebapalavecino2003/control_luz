# Manifiesto del conector. Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E1-PB-LECA-LUZ01"            # igual a la carpeta
version = "0.1.0"
sdk     = ">=1,<2"                      # versiones de aura_sdk con las que funciona
autores = ["TODO-usuario-github"]       # TODO: los usuarios de GitHub del grupo
clase   = "conector:ConectorLuz01"      # archivo:Clase

# Cada campo que acepta, con su unidad y su rango físico. Un valor fuera de rango, o un campo
# que no está acá, no se guarda. Tiene que coincidir con lo que manda el firmware.
[campos.presencia]
unidad = "0/1"
min = 0
max = 1

# Etapa 2: el firmware los manda solo con el hardware conectado (BH1750 por I2C
# y relé). Mientras no estén, no llegan y no se guarda nada de esto.
[campos.luz_ventana_lx]
unidad = "lx"
min = 0
max = 65535

[campos.luz_aula_lx]
unidad = "lx"
min = 0
max = 65535

[campos.rele_canal1]
unidad = "0/1"
min = 0
max = 1

[campos.rele_canal2]
unidad = "0/1"
min = 0
max = 1
